<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Unificado - Controlo Total de Periféricos</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --online: #22c55e;
            --offline: #ef4444;
            --testing: #eab308;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #24324d;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 24px; color: var(--accent); font-weight: 800; }
        
        .gama-badge {
            background: #24324d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-family: monospace;
        }

        /* 1. Zona de Redirecionamento Inicial */
        #zona-atalho-rapido {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .timer-alerta { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .spinner-mini {
            border: 3px solid rgba(255,255,255,0.1);
            width: 16px; height: 16px; border-radius: 50%;
            border-left-color: var(--accent);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 2. Formulário de Configuração */
        .painel-config {
            background: var(--bg-card);
            border: 1px solid #24324d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .campo { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
        .campo label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        
        input, select, button {
            background: #0b0f19; border: 1px solid #475569; color: var(--text-main);
            padding: 10px; border-radius: 6px; font-size: 13px; outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }

        button { cursor: pointer; font-weight: 700; background: var(--accent); color: #0b0f19; border: none; }
        button:hover { opacity: 0.9; }
        .btn-varrer { background: transparent; border: 1px solid var(--online); color: var(--online); }
        .btn-varrer:hover { background: var(--online); color: #0b0f19; }

        /* 3. Área de Trabalho Dividida (Grelha de Pings vs Ecrãs em Direto) */
        .area-trabalho {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .coluna-esquerda {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 5px;
        }

        .coluna-direita-ecras {
            flex: 1.5;
            overflow-y: auto;
            background: #070a12;
            border: 1px solid #24324d;
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            align-content: start;
        }

        /* Elementos da Grelha/Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid #24324d;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card.online { border-left: 4px solid var(--online); }
        .card.offline { border-left: 4px solid var(--offline); }
        .card.testing { border-left: 4px solid var(--testing); }

        .info-txt h3 { margin: 0 0 4px 0; font-size: 15px; }
        .info-txt .ip { font-family: monospace; font-size: 13px; color: var(--accent); font-weight: bold; }
        .info-txt .tipo { font-size: 11px; color: var(--text-muted); }

        .botoes-card { display: flex; gap: 8px; }
        .btn-link { text-decoration: none; background: #24324d; color: var(--text-main); padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn-link:hover { background: var(--accent); color: #0b0f19; }
        .btn-apagar { background: transparent; color: var(--offline); border: 1px solid var(--offline); padding: 5px 10px; border-radius: 4px; font-size: 11px; }

        /* Módulos do Monitor de Ecrã (Direto) */
        .box-ecra {
            background: var(--bg-card);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .box-ecra-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; }
        .frame-imagem {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid #24324d;
        }
        .frame-imagem img { width: 100%; height: 100%; object-fit: contain; }
        .tag-live { position: absolute; top: 6px; left: 6px; background: var(--offline); color: white; padding: 2px 5px; font-size: 9px; font-weight: bold; border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <h1>🎣 Grelha de Pesca - Controlo Unificado de Periféricos</h1>
        <div class="gama-badge">Sub-redes: 192.168.0.X / 192.168.1.X</div>
    </header>

    <!-- 1. Módulo de Redirecionamento Automático Inicial -->
    <div id="zona-atalho-rapido">
        <div class="timer-alerta">
            <div class="spinner-mini"></div>
            <span>A redirecionar em segurança para o IP padrão em <strong id="contagem">3</strong>s...</span>
        </div>
        <div>
            <select id="atalhoIP" onchange="cancelarERedirecionar(this.value)" style="background:#151f32; padding:5px;">
                <option value="">-- Mudar Salto Rápido --</option>
                <option value="192.168.1.88">192.168.1.88 (JCPereira)</option>
                <option value="192.168.0.1">192.168.0.1 (ETPR-SINF)</option>
                <option value="192.168.1.254">192.168.1.254 (Router)</option>
            </select>
            <button onclick="pararRedirecionamento()" style="padding: 6px 12px; background:var(--offline); color:white; font-size:12px;">Parar Salto</button>
        </div>
    </div>

    <!-- 2. Formulário do Gestor de Inventário -->
    <div class="painel-config">
        <div class="campo">
            <label for="ipAlvo">Endereço IP</label>
            <input type="text" id="ipAlvo" value="192.168.1.88">
        </div>
        <div class="campo">
            <label for="nomeAlvo">Nome do Dispositivo</label>
            <input type="text" id="nomeAlvo" placeholder="Ex: PC Aluno 10">
        </div>
        <div class="campo">
            <label for="tipoAlvo">Classe</label>
            <select id="tipoAlvo">
                <option value="🖥️ Computador">🖥️ Computador</option>
                <option value="🖨️ Impressora">🖨️ Impressora</option>
                <option value="🌐 Gateway / Router">🌐 Router</option>
                <option value="📷 Câmara IP">📷 Câmara IP</option>
            </select>
        </div>
        <button onclick="adicionarAInventario()">Inserir Dispositivo</button>
        <button class="btn-varrer" onclick="varrerPingsRede()">Atualizar Estado (Ping)</button>
    </div>

    <!-- 3. Interface de Monitorização Dividida -->
    <div class="area-trabalho">
        
        <!-- Esquerda: Grelha Ativa de Dispositivos (Pings) -->
        <div class="coluna-esquerda" id="contentorGrelha">
            <!-- Injetado dinamicamente via Javascript -->
        </div>

        <!-- Direita: Transmissão de Ecrãs Ativa (Imagens dos Scripts) -->
        <div class="coluna-direita-ecras">
            
            <!-- Monitor ETPR-SINF12-10 -->
            <div class="box-ecra">
                <div class="box-ecra-header">
                    <span style="color:var(--accent)">🖥️ ETPR-SINF12-10</span>
                    <span>📍 IP: 192.168.0.1</span>
                </div>
                <div class="frame-imagem">
                    <div class="tag-live">DIRETO</div>
                    <img id="img-sinf" src="ETPR-SINF12-10.jpg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://w3.org\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'%2324324d\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z\'/></svg>'">
                </div>
            </div>

            <!-- Monitor DESKTOP-FSK7C12 -->
            <div class="box-ecra">
                <div class="box-ecra-header">
