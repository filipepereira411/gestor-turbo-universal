<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grelha de Pesca TOTAL</title>
    <style>
        :root {
            --bg-main: #0f0f12;
            --bg-card: #16161a;
            --accent: #007bff;
            --text-main: #ffffff;
            --text-muted: #9a9a9f;
            --online: #22c55e;
            --offline: #ef4444;
            --testing: #eab308;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #24242b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 22px; font-weight: 800; }
        
        .status-top-bar {
            font-size: 13px;
            background: #24242b;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: monospace;
            color: var(--text-muted);
        }

        .layout-principal {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        /* Coluna Esquerda: A Grelha de Dispositivos */
        .zona-grelha {
            flex: 1.2;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            align-content: start;
            padding-right: 5px;
        }

        /* Coluna Direita: O Monitor do Ecrã Ativo */
        .zona-monitor {
            flex: 1.5;
            background: #000000;
            border: 2px solid #24242b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .monitor-header {
            background: #1c1c24;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 14px;
            color: var(--accent);
            border-bottom: 1px solid #24242b;
            display: flex;
            justify-content: space-between;
        }

        .monitor-corpo {
            width: 100%;
            height: 100%;
            position: relative;
            background: #050507;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .sem-selecao {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-size: 15px;
            text-align: center;
        }

        /* Estilo dos Cards da Grelha */
        .card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-left: 5px solid var(--offline);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { transform: translateY(-2px); background: #1c1c22; }
        .card.active { border: 1px solid var(--accent); border-left: 5px solid var(--accent); }
        .card.online { border-left-color: var(--online); }
        .card.offline { border-left-color: var(--offline); }
        .card.testing { border-left-color: var(--testing); }

        .info-txt h3 { margin: 0 0 4px 0; font-size: 16px; font-weight: 700; }
        .info-txt .ip { font-family: monospace; font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
        .info-txt .tipo { font-size: 10px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; background: #202026; padding: 3px 6px; border-radius: 4px; display: inline-block; }

        .botoes-card { display: flex; gap: 8px; }
        .btn-energia { font-size: 11px; font-weight: bold; padding: 6px 10px; border-radius: 4px; border: none; color: white; cursor: pointer; flex: 1; }
        .btn-ligar { background: var(--online); }
        .btn-desligar { background: var(--offline); }

        .indicador-ponto {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--offline);
        }
        .online .indicador-ponto { background: var(--online); box-shadow: 0 0 8px var(--online); }
        .testing .indicador-ponto { background: var(--testing); }
    </style>
</head>
<body>

    <header>
        <h1>🎣 Grelha de Pesca Master - Controlo Total ETPR</h1>
        <div class="status-top-bar" id="registo-contagem">A mapear o parque periférico...</div>
    </header>

    <div class="layout-principal">
        
        <!-- Grelha Gerada Automaticamente -->
        <div class="zona-grelha" id="contentorMestre">
            <!-- Gerado por JavaScript -->
        </div>

        <!-- Janela de Visualização Ativa -->
        <div class="zona-monitor" id="painelMonitor">
            <div class="monitor-header">
                <span id="txt-nome-monitor">📺 Monitor de Transmissão Ativo</span>
                <span id="txt-ip-monitor">IP: Selecione uma máquina</span>
            </div>
            <div class="monitor-corpo" id="corpoMonitor">
                <div class="sem-selecao">Clique num cartão da grelha para interagir com o ecrã do periférico via noVNC...</div>
            </div>
        </div>

    </div>

<script>
// Lista estática estruturada exatamente com os alvos mapeados do seu parque escolar
const listaRede = [
    { ip: "192.168.0.1", nome: "S12 ETPR (TP-Link Gateway)", tipo: "🌐 ROUTER / GATEWAY" },
    { ip: "192.168.0.10", nome: "PC 10 S12 (ETPR)", tipo: "🖥️ COMPUTADOR" },
    { ip: "192.168.1.1", nome: "Gateway Infraestrutura Central", tipo: "🌐 ROUTER / GATEWAY" },
    { ip: "192.168.1.88", nome: "DESKTOP-FSK7C12 (Professor)", tipo: "🖥️ COMPUTADOR" },
    { ip: "192.168.1.254", nome: "Router Distribuição Operadora", tipo: "🌐 ROUTER / GATEWAY" }
];

function inicializarGrelha() {
    const grelha = document.getElementById('contentorMestre');
    grelha.innerHTML = '';

    listaRede.forEach((item, index) => {
        grelha.innerHTML += `
            <div class="card offline" id="pc-${index}" onclick="sintonizarEcra('${item.ip}', '${item.nome}', ${index})">
                <div class="indicador-ponto"></div>
                <div class="info-txt">
                    <h3>${item.nome}</h3>
                    <div class="ip">${item.ip}</div>
                    <div class="tipo">${item.tipo}</div>
                </div>
                ${item.tipo.includes("COMPUTADOR") ? `
                <div class="botoes-card" onclick="event.stopPropagation();">
                    <button class="btn-energia btn-ligar" onclick="acaoLigar('${item.ip}')">WOL</button>
                    <button class="btn-energia btn-desligar" onclick="acaoDesligar('${item.ip}')">OFF</button>
                </div>
                ` : ''}
            </div>
        `;
    });
    
    document.getElementById('registo-contagem').innerText = `Monitorizados: ${listaRede.length} Alvos`;
}

// Sintonizador do Monitor noVNC Direito
function sintonizarEcra(ip, nome, index) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById(`pc-${index}`).classList.add('active');

    document.getElementById('txt-nome-monitor').innerText = `🔴 EM DIRETO: ${nome}`;
    document.getElementById('txt-ip-monitor').innerText = `IP: ${ip}`;

    const corpo = document.getElementById('corpoMonitor');
    
    // Se for router abre a porta normal HTTP, se for computador aponta ao proxy noVNC (Porta 6080)
    const urlFinal = ip.endsWith(".1") || ip.endsWith(".254") 
        ? `http://${ip}` 
        : `http://${ip}:6080/vnc.html?autoconnect=true&resize=scale`;

    corpo.innerHTML = `<iframe src="${urlFinal}" title="Transmissão Ativa"></iframe>`;
}

// Motor de Rastreio (Scanner de Pings Silenciosos)
function fazerScanPeriferico(ip, index) {
    const card = document.getElementById(`pc-${index}`);
    const ping = new Image();
    const tStart = Date.now();

    ping.onload = function() { marcarEstado(card, "online"); };
    ping.onerror = function() {
        if ((Date.now() - tStart) < 1200) {
            marcarEstado(card, "online");
        } else {
            marcarEstado(card, "offline");
        }
    };
    ping.src = `http://${ip}/favicon.ico?t=${tStart}`;
}

function marcarEstado(elemento, status) {
    if(elemento && !elemento.classList.contains('active')) {
        elemento.className = `card ${status}`;
    } else if (elemento) {
        elemento.className = `card ${status} active`;
    }
}

function varrerTodaARede() {
    listaRede.forEach((item, index) => fazerScanPeriferico(item.ip, index));
}

// Comandos de Energia Remotos
function acaoLigar(ip) {
    alert(`A disparar Magic Packet (Wake-on-LAN) para o IP ${ip}`);
    fetch(`http://localhost:3000/api/wol?ip=${ip}`).catch(() => {});
}

function acaoDesligar(ip) {
    if(confirm(`Pretende enviar ordem de encerramento imediato para o IP ${ip}?`)) {
        fetch(`http://${ip}:8000/shutdown`).catch(() => {});
    }
}

// Inicializar e rodar o loop de rede a cada 4 segundos
inicializarGrelha();
varrerTodaARede();
setInterval(varrerTodaARede, 4000);
</script>

</body>
    </html>
