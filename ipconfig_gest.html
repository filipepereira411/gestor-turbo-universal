<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Painel de Controlo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login Administração</h2>
    <form id="loginForm" onsubmit="validarLogin(event)">
        <div class="input-group">
            <label for="username">Utilizador</label>
            <input type="text" id="username" required placeholder="Ex: admin">
        </div>
        <div class="input-group">
            <label for="password">Palavra-passe</label>
            <input type="password" id="password" required placeholder="Ex: admin">
        </div>
        <button type="submit">Entrar</button>
        <div id="error" class="error-message">Utilizador ou senha incorretos!</div>
    </form>
</div>

<script>
function validarLogin(event) {
    // Impede o formulário de recarregar a página antes da validação
    event.preventDefault(); 
    
    const usuarioInput = document.getElementById('username').value;
    const senhaInput = document.getElementById('password').value;
    const erroDiv = document.getElementById('error');

    // Validação das credenciais pedidas: admin / admin
    if (usuarioInput === "admin" && senhaInput === "admin") {
        erroDiv.style.display = "none";
        alert("Acesso concedido! Redirecionando para a gestão de periféricos...");
        
        // Exemplo de redirecionamento para a página do router local
        window.location.href = "http://192.168.1.254"; 
    } else {
        // Mostra a mensagem de erro caso falhe
        erroDiv.style.display = "block";
    }
}
</script>

</body>
</html>
